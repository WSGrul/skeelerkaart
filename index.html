<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skeelerkaart Zuid-Holland</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
html,body{height:100%;margin:0;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:#f4f6f8;border-bottom:1px solid #ccd}
#bar select{font:inherit;padding:5px 8px;border:1px solid #99a;border-radius:6px;background:#fff}
#map{flex:1}
#st{flex-basis:100%;color:#333;min-height:1.2em}
.lg i{display:inline-block;width:18px;height:5px;margin:0 3px 2px 8px;border-radius:2px}
</style></head><body>
<div id="bar">
  <b id="zl"></b>
  <select id="fs"><option value="all">Alle ondergronden</option><option value="plus">Asfalt + onbekend</option><option value="asphalt" selected>Alleen asfalt</option></select>
  <select id="fq"><option value="0">Elke kwaliteit</option><option value="3">Goed of beter</option><option value="4">Alleen uitstekend</option><option value="unk">Kwaliteit onbekend</option></select>
  <span class="lg"><i style="background:#0a8a3a"></i>uitstekend<i style="background:#7bc043"></i>goed<i style="background:#f5a623"></i>matig<i style="background:#d9381e"></i>slecht<i style="background:#7a7a7a"></i>onbekend<i style="background:repeating-linear-gradient(90deg,#a07850 0 4px,#fff 4px 7px)"></i>geen asfalt</span>
  <div id="st">Data laden…</div>
</div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const RANK={excellent:4,good:3,intermediate:2,bad:1};
const COL={excellent:'#0a8a3a',good:'#7bc043',intermediate:'#f5a623',bad:'#d9381e',unknown:'#7a7a7a'};
const norm=s=>RANK[s]?s:(s?'bad':'');
const MINZ=11;

const map=L.map('map',{preferCanvas:true}).setView([52.16,4.49],13); // Leiden
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-bijdragers'}).addTo(map);

let IDX=null;const ways=new Map(),got=new Set(),pending=new Set();

function pass(w){
  const as=w.s==='asphalt',fs=$('fs').value,fq=$('fq').value;
  if(fs==='asphalt'&&!as)return false;
  if(fs==='plus'&&!(as||!w.s))return false;
  if(fq==='unk')return !norm(w.q);
  if(+fq&&(RANK[norm(w.q)]||0)<+fq)return false;
  return true;
}
function style(w){
  const q=norm(w.q),other=w.s&&w.s!=='asphalt';
  return{color:other&&!q?'#a07850':COL[q||'unknown'],weight:4,opacity:.9,dashArray:other?'6 6':null};
}
function refresh(){
  for(const w of ways.values()){
    if(pass(w)){w.line.setStyle(style(w));if(!map.hasLayer(w.line))w.line.addTo(map)}
    else if(map.hasLayer(w.line))map.removeLayer(w.line);
  }
}
function stats(){
  let a=0,q=0;for(const w of ways.values())if(w.s==='asphalt'){a++;if(w.q)q++}
  $('st').textContent=`${ways.size} paden geladen · ${a} asfalt, waarvan ${q} met kwaliteit · data van ${IDX.updated}`;
}
function addWays(list){
  for(const [id,hw,s,q,name,flat] of list){
    if(ways.has(id))continue;
    const g=[];for(let i=0;i<flat.length;i+=2)g.push([flat[i],flat[i+1]]);
    const w={id,hw,s,q,name,line:L.polyline(g,{bubblingMouseEvents:false})};
    w.line.on('click',e=>L.popup().setLatLng(e.latlng).setContent(
      `<b>${esc(name||'Fietspad')}</b><br>Ondergrond: ${esc(s||'onbekend')}<br>Kwaliteit: ${esc(q||'onbekend')}<br>`+
      `<a target="_blank" href="https://www.openstreetmap.org/edit?way=${id}">Aanvullen in OSM ↗</a>`).openOn(map));
    ways.set(id,w);
  }
}
async function loadVisible(){
  if(!IDX)return;
  if(map.getZoom()<MINZ){$('st').textContent=`Zoom in (niveau ${MINZ}+) om paden te tonen.`;return}
  const b=map.getBounds(),{dy,dx}=IDX,todo=[];
  for(let y=Math.floor(b.getSouth()/dy);y<=Math.floor(b.getNorth()/dy);y++)
    for(let x=Math.floor(b.getWest()/dx);x<=Math.floor(b.getEast()/dx);x++){
      const k=y+'_'+x;
      if(IDX.chunks[k]&&!got.has(k)&&!pending.has(k))todo.push(k);
    }
  await Promise.all(todo.map(async k=>{
    pending.add(k);
    try{const r=await fetch('data/'+k+'.json');addWays((await r.json()).w);got.add(k)}
    catch(e){$('st').textContent='Een datablok kon niet geladen worden.'}
    pending.delete(k);
  }));
  if(todo.length){refresh();stats()}
}
const showZ=()=>{const z=Math.round(map.getZoom());$('zl').textContent='Zoom '+z+(z<MINZ?' (te ver uit)':'')};
map.on('zoomend',showZ);showZ();
let tm;map.on('moveend',()=>{clearTimeout(tm);tm=setTimeout(loadVisible,300)});
$('fs').onchange=$('fq').onchange=refresh;

fetch('data/index.json').then(r=>r.json()).then(j=>{IDX=j;loadVisible()})
  .catch(()=>{$('st').textContent='Geen data gevonden. Is de GitHub Action al gelopen?'});
</script></body></html>
