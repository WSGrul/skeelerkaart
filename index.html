<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skeelerkaart Zuid-Holland</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
html,body{height:100%;margin:0;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:#f4f6f8;border-bottom:1px solid #ccd}
#bar button,#bar select{font:inherit;padding:5px 8px;border:1px solid #99a;border-radius:6px;background:#fff}
#bar button.on{background:#1976d2;color:#fff;border-color:#1976d2}
#bar button{cursor:pointer}
#bar button:disabled{opacity:.4}
#map{flex:1}
.leaflet-popup-content input,.leaflet-popup-content select{margin:3px 0;font:inherit;max-width:100%}
.leaflet-popup-content button{margin:4px 4px 4px 0}
#st{flex-basis:100%;color:#333;min-height:1.2em}
.lg i{display:inline-block;width:18px;height:5px;margin:0 3px 2px 8px;border-radius:2px}
</style>
</head>
<body>
<div id="bar">
  <b id="zl"></b>
  <select id="fs">
    <option value="all">Alle ondergronden</option>
    <option value="plus">Asfalt + onbekend</option>
    <option value="asphalt" selected>Alleen asfalt</option>
  </select>
  <select id="fq">
    <option value="0">Elke kwaliteit</option>
    <option value="3">Goed of beter</option>
    <option value="4">Alleen uitstekend</option>
    <option value="unk">Kwaliteit onbekend</option>
  </select>
  <button id="bRoads" title="Gedeelde wegen tonen (vanaf zoom 12)">Wegen</button>
  <button id="bRoute">Route maken</button>
  <button id="bUndo" title="Ongedaan maken">↶</button>
  <button id="bRedo" title="Opnieuw">↷</button>
  <button id="bBack">Terug naar start</button>
  <button id="bClear">Wis route</button>
  <b id="ri"></b>
  <button id="bGpx">GPX</button>
  <button id="bExp">Export labels</button>
  <button id="bImp">Import</button>
  <input type="file" id="fImp" accept=".json" hidden>

  <span class="lg">
    <i style="background:#0a8a3a"></i>uitstekend
    <i style="background:#7bc043"></i>goed
    <i style="background:#f5a623"></i>matig
    <i style="background:#d9381e"></i>slecht
    <i style="background:repeating-linear-gradient(90deg,#7656a8 0 2px,transparent 2px 5px)"></i>oppervlak onbekend
    <i style="background:repeating-linear-gradient(90deg,#555 0 6px,transparent 6px 9px)"></i>asfalt, kwaliteit onbekend
    <i style="background:repeating-linear-gradient(90deg,#a07850 0 4px,#fff 4px 7px)"></i>geen asfalt
    <i style="height:2px"></i>dun = gedeelde weg
  </span>

  <div id="st">Data laden…</div>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const RANK = {excellent:4,good:3,intermediate:2,bad:1};
const COL = {
  excellent:'#0a8a3a',
  good:'#7bc043',
  intermediate:'#f5a623',
  bad:'#d9381e',
  unknown:'#7a7a7a'
};
const norm = s => RANK[s] ? s : (s ? 'bad' : '');
const MINZ = 11, MINZR = 12;
let roadsOn = false;
const Q = {
  excellent:'Uitstekend',
  good:'Goed',
  intermediate:'Matig',
  bad:'Slecht'
};

let mine = {};
try {
  mine = JSON.parse(localStorage.getItem('skeeler') || '{}');
} catch(e) {}

const save = () => {
  try {
    localStorage.setItem('skeeler', JSON.stringify(mine));
  } catch(e) {}
};

const eff = w => {
  const m = mine[w.id] || {};
  return {
    s:m.surface || w.s,
    q:m.smooth || w.q,
    own:!!mine[w.id]
  };
};

const st = t => $('st').textContent = t;
const map = L.map('map', {preferCanvas:true}).setView([52.16,4.49],13); // Leiden

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'© OpenStreetMap-bijdragers'
}).addTo(map);

let IDX = null;
const ways = new Map(), got = new Set(), pending = new Set();

function pass(w) {
  if (w.road && !roadsOn) return false;

  const e = eff(w), as = e.s === 'asphalt';
  const fs = $('fs').value, fq = $('fq').value;

  if (fs === 'asphalt' && !as) return false;
  if (fs === 'plus' && !(as || !e.s)) return false;
  if (fq === 'unk') return !norm(e.q);
  if (+fq && (RANK[norm(e.q)] || 0) < +fq) return false;

  return true;
}

function style(w) {
  const e = eff(w), q = norm(e.q);
  const unknownSurface = !e.s;
  const unknownAsphaltQuality = e.s === 'asphalt' && !q;
  const other = e.s && e.s !== 'asphalt';

  return {
    color: unknownSurface
      ? '#7656a8'
      : unknownAsphaltQuality
        ? '#555555'
        : other && !q
          ? '#a07850'
          : COL[q || 'unknown'],
    weight:(w.road ? 3 : 5) + (e.own ? 2 : 0),
    opacity:w.road ? .75 : .9,
    dashArray:unknownSurface
      ? '2 5'
      : unknownAsphaltQuality
        ? '8 5'
        : other
          ? '6 6'
          : null
  };
}

function refresh() {
  for (const w of ways.values()) {
    if (pass(w)) {
      w.line.setStyle(style(w));
      if (!map.hasLayer(w.line)) w.line.addTo(map);
    } else if (map.hasLayer(w.line)) {
      map.removeLayer(w.line);
    }
  }

  if (roadsOn) {
    for (const w of ways.values()) {
      if (!w.road && map.hasLayer(w.line)) w.line.bringToFront();
    }
  }
}

function stats() {
  let a = 0, q = 0, r = 0;

  for (const w of ways.values()) {
    if (w.road) {
      r++;
      continue;
    }

    const e = eff(w);
    if (e.s === 'asphalt') {
      a++;
      if (e.q) q++;
    }
  }

  $('st').textContent =
    `${ways.size-r} paden${r ? ` + ${r} wegen` : ''} geladen · ` +
    `${a} asfalt, waarvan ${q} met kwaliteit · data van ${IDX.updated}`;
}

function addWays(list) {
  for (const [id, hw, s, q, name, flat, ms] of list) {
    if (ways.has(id)) continue;

    const g = [];
    for (let i = 0; i < flat.length; i += 2) {
      g.push([flat[i], flat[i+1]]);
    }

    const w = {
      id, hw, s, q, name, ms,
      road:!'cpf'.includes(hw),
      geom:g,
      line:L.polyline(g, {bubblingMouseEvents:false})
    };

    w.line.on('click', e => onWay(w, e));
    ways.set(id, w);
  }
}

async function loadKeys(keys, label) {
  let i = 0, n = 0,
