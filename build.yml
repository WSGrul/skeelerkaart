name: Bouw kaart

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 5 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REGIONS: "europe/netherlands/zuid-holland"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: m
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - id: cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ hashFiles('build_data.py') }}-${{ env.REGIONS }}-${{ steps.m.outputs.month }}

      - name: Data maken
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python3 build_data.py

      - name: Site samenstellen
        run: |
          mkdir site
          cp index.html site/
          cp -r data site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
